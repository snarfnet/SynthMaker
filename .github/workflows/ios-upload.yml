name: SynthMaker App Store upload
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/ios-upload.yml]
permissions:
  contents: read
jobs:
  upload:
        description: Upload signed build after tests pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lumi-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Portable project checks and newline regression
        run: |
          python3 tools/static_verify.py
          python3 tools/test_static_verify.py
      - name: Simulator tests and unsigned device build
        run: bash tools/verify_on_mac.sh
      - name: Keep build logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-validation-${{ github.run_id }}
          path: |
            validation/mac/*.txt
            validation/mac/*.log
            validation/mac/*.xcresult
            validation/mac/*.json
            validation/mac/attachments-*
            validation/windows-validation.json
          retention-days: 14

  upload:
    runs-on: macos-26
    timeout-minutes: 60

    env:
      BUNDLE_IDENTIFIER: com.tokyonasu.SynthMaker
      TEAM_ID: 83VGKGSQUH

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test groove DSP
        run: |
          swiftc SynthMaker/GrooveCore.swift Tests/GrooveCoreTests.swift -o "$RUNNER_TEMP/groove-tests"
          "$RUNNER_TEMP/groove-tests"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Python dependencies
        run: python3 -m pip install --break-system-packages PyJWT requests

      - name: Prepare App Store Connect key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Create signing assets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          EXISTING_CERTIFICATE_ID: ${{ secrets.EXISTING_CERTIFICATE_ID }}
          DISTRIBUTION_P12_BASE64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          CSR_PATH: ${{ runner.temp }}/dist.csr
          CERT_PATH: ${{ runner.temp }}/dist.cer
          PROFILE_PATH: ${{ runner.temp }}/profile.mobileprovision
          PROFILE_NAME: SynthMaker Techno App Store Profile ${{ github.run_id }}
        run: |
          cp "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" "$ASC_KEY_PATH"
          python3 tools/create_signing_assets.py
          echo "$DISTRIBUTION_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"

      - name: Import certificate and profile
        env:
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security import "$RUNNER_TEMP/dist.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$DISTRIBUTION_P12_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild archive \
            -project SynthMaker.xcodeproj \
            -scheme SynthMaker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SynthMaker.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID"

      - name: Export IPA
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_IDENTIFIER</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SynthMaker.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/output"

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/output" -name "*.ipa" -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"
